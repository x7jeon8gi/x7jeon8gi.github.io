# =============================================================================
# Site settings — Namhyoung Kim · Personal Website
# Hand-crafted Jekyll site, laid out like a research-group page
# =============================================================================

title:        Namhyoung Kim
tagline:      Quantitative AI Researcher
description:  >
  Personal website of Namhyoung Kim, Head of Research at Risk X tech Lab
  and Ph.D. in Industrial Engineering from Hanyang University.
  Research interests include representation learning for low signal-to-noise
  data, discrete latent factor models, decision-aware learning, and robustness
  to regime shift.
author:       Namhyoung Kim
email:        ai.namhyoung@gmail.com

# Production URL (used by jekyll-seo-tag, sitemap, RSS)
url:          "https://x7jeon8gi.github.io"
baseurl:      ""

# =============================================================================
# Build settings
# =============================================================================

markdown:     kramdown
highlighter:  rouge
permalink:    pretty

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - node_modules
  - .DS_Store
  - .git
  - .gitignore
  - "*.tex"
  - "*.txt"
  - "*.docx"
  - "*.zip"
  - Portfolio_Hana_source.html
  - Namhyoung_Kim_*.pdf
  - "이력서_*"
  - website

sass:
  style: compressed

# =============================================================================
# Site navigation and interface text live in _data/i18n.yml (English and
# Korean). Korean pages are the files under ko/ with `lang: ko`.
# =============================================================================

lang: en

# =============================================================================
# Social / external links (rendered in footer)
# =============================================================================

social:
  - name: Email
    icon: email
    url:  "mailto:ai.namhyoung@gmail.com"
  - name: GitHub
    icon: github
    url:  "https://github.com/x7jeon8gi"
  - name: Google Scholar
    icon: scholar
    url:  "https://scholar.google.com/citations?user=YbxuDSIAAAAJ"
  - name: LinkedIn
    icon: linkedin
    url:  "https://www.linkedin.com/in/ai-namhyoung/"
  - name: CV (PDF)
    icon: pdf
    url:  "/assets/pdf/CV.pdf"
