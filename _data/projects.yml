# =============================================================================
# Projects and grants, rendered on /projects/ and in the CV page.
#
#   ongoing        : running now (period ends with "Present")
#   grants         : completed government research grants
#   industry       : completed industry projects
#
# Fields: id, title, sponsor, program (optional), period, role (optional),
#         desc (optional, one or two sentences)
# When a project ends, change its period and move it to grants or industry.
# Korean pages read title_ko, sponsor_ko, program_ko, role_ko and desc_ko; a
# missing _ko field falls back to English (program is hidden on /ko/ without one).
# =============================================================================

ongoing:
  - id:      sba26-els-hedging
    title:   "ELS Hedging Decision System via Neural Optimal Control"
    sponsor: "Seoul Business Agency (SBA)"
    program: "Fintech Commercialization Program"
    period:  "2026.07 – Present"
    role:    "Project Lead"
    desc:    "Formulates the hedge-ratio decision for structured products as an optimal control problem, with development carried out by research teams at Sungkyunkwan University and Hanyang University."
    title_ko:   "신경망 기반 최적제어를 활용한 ELS 헤징 의사결정 시스템 개발"
    sponsor_ko: "서울경제진흥원(SBA)"
    program_ko: "핀테크 기술사업화 지원사업"
    role_ko:    "과제 총괄"
    desc_ko:    "구조화상품의 헤지 비중 결정을 최적제어 문제로 정식화하는 과제. 개발은 성균관대학교와 한양대학교 연구팀이 수행하고, 과제 총괄과 연구 방향 설정, 기관 간 조율을 담당."

  - id:      tips26-structured
    title:   "Investor-Tailored Structured Derivatives via Time-Series Generation"
    sponsor: "TIPS R&amp;D"
    period:  "2026.04 – Present"
    role:    "Technical Lead"
    desc:    "Builds a recommendation and selection procedure for investor-tailored ELS with decision-focused learning (SPO+ surrogate loss), a capital-adjusted objective, and simulation-based screening of maturity exposure."
    title_ko:   "시계열 생성 기반 투자자 맞춤 구조화 파생상품 개발"
    sponsor_ko: "팁스(TIPS) R&amp;D"
    role_ko:    "기술 총괄"
    desc_ko:    "투자자 맞춤 구조화상품(ELS) 추천 및 선택 체계를 구축하는 과제. 최종 선택의 손실을 직접 줄이는 의사결정 중심 학습을 적용하고 SPO+ 대리손실로 추천 모형을 학습해 예측 단계와 선택 단계의 목적을 일치시킴. 자본 점유를 보정한 목적함수와 시뮬레이션 기반 만기 노출 선별을 결합해 운용 제약을 감안한 추천 절차를 정립."

