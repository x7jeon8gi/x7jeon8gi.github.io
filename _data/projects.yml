industry:
  - id:      kftc25
    title:   "Analysis of Financial Activities using AI Technologies"
    sponsor: "Korea Financial Telecommunications &amp; Clearings Institute (KFTC)"
    period:  "2025.03 – 2025.07"
    role:    "Model design and implementation"
    desc:    "Defined units of analysis for financial activity data and grouped activity patterns by combining contrastive embeddings with unsupervised clustering."
    title_ko:   "AI 기술을 활용한 금융 활동 분석"
    sponsor_ko: "금융결제원(KFTC)"
    role_ko:    "연구원, 모형 설계 및 구현"
    desc_ko:    "금융 활동 데이터의 분석 단위를 정의하고 대조학습 임베딩과 비지도 군집을 결합해 활동 패턴을 유형화. 군집별 특성을 정성적, 정량적으로 해석해 보고서로 정리."

  - id:      fndatalab24-pension
    title:   "Machine Learning-Based Model Portfolios for Retirement Pension Management"
    sponsor: "FnDataLab"
    period:  "2024.03 – 2024.06"
    role:    "Researcher"
    desc:    "Asset embeddings from self-supervised learning, turned into allocations for each investor risk propensity and evaluated by backtest."
    title_ko: "퇴직연금 관리를 위한 기계학습 기반 모델 포트폴리오"
    role_ko:  "연구원"
    desc_ko:  "자기지도 학습으로 자산 임베딩을 구성하고 가입자의 위험 성향별 배분을 산출하는 체계를 설계. 백테스트 기반 성과 평가 담당."

  - id:      riskx23-exotic
    title:   "Pricing of Exotic Options and Structured Products via Machine Learning"
    sponsor: "Risk X tech Lab"
    period:  "2023.10 – 2024.01"
    role:    "Researcher"
    desc:    "Deep hedging and neural-operator pricing models for ELS and other structured products, reducing the computational cost of conventional numerical methods."
    title_ko: "기계학습을 통한 이색 옵션 및 구조화상품 프라이싱"
    role_ko:  "연구원"
    desc_ko:  "ELS를 포함한 구조화상품의 페이오프 구조를 정리하고 딥헤징 프레임워크와 Neural Operator 기반 가격산출 모형을 구현해 기존 수치해법의 계산 부담을 완화."

  - id:      fndatalab23-risk
    title:   "Machine Learning-driven Risk Rating Assessment of Global Investment Assets"
    sponsor: "FnDataLab"
    period:  "2023.05 – 2023.08"
    role:    "Model design and implementation"
    desc:    "Contrastive clustering of assets with similar risk characteristics, mapped to risk grades and documented in a validation report."
    title_ko: "기계학습 기반 글로벌 투자자산 위험등급 산정"
    role_ko:  "연구원, 모형 설계 및 구현"
    desc_ko:  "투자자산의 시계열 및 재무 특성을 정제하고 대조 군집화로 위험 특성이 유사한 자산을 묶은 뒤, 군집을 위험등급으로 사상하는 평가 모형을 설계, 구현하고 검증 리포트를 작성."

  - id:      ioisoft22-sales
    title:   "Sales Analytics based on Graph Neural Network and Natural Language Processing"
    sponsor: "IOI Soft"
    period:  "2022.11"
    role:    "Researcher"
    desc:    "B2B transactions modeled as a graph, combining graph neural network representations with text embeddings of the related documents."
    title_ko: "그래프 신경망과 자연어 처리 기반 세일즈 애널리틱스"
    role_ko:  "연구원"
    desc_ko:  "B2B 거래 데이터를 그래프로 구성하고 그래프 신경망 표현과 텍스트 임베딩을 결합해, 거래 관계와 문서 정보를 함께 활용하는 분석 모형을 설계."

  - id:      hyperlounge21
    title:   "Business Analytics for Small and Medium-sized Enterprises"
    sponsor: "Hyperlounge"
    period:  "2021.10 – 2021.11"
    role:    "Researcher"
    desc:    "Organized the management data of small and medium-sized enterprises into an analyzable form and designed an analytics framework for decision-making."
    title_ko:   "중소기업 맞춤형 비즈니스 애널리틱스 개발"
    sponsor_ko: "하이퍼라운지"
    role_ko:    "연구원"
    desc_ko:    "중소기업의 경영 데이터를 분석 가능한 형태로 정리하고 의사결정에 활용할 분석 체계를 설계."

  - id:      kofpi21-forest
    title:   "Business Effectiveness Analysis on Fine Dust Reduction Forest Project"
    sponsor: "Korea Forestry Promotion Institute (KOFPI)"
    program: "Research Grant"
    period:  "2021.05 – 2021.10"
    sponsor_ko: "한국임업진흥원(KOFPI)"
