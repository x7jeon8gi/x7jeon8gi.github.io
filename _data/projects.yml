ongoing:
  - id:      sba26-els-hedging
    title:   "ELS Hedging Decision System via Neural Optimal Control"
    sponsor: "Seoul Business Agency (SBA)"
    program: "Fintech Commercialization Program"
    period:  "2026.07 – Present"
    role:    "Project Lead"
    desc:    "Formulates the hedge-ratio decision for structured products as an optimal control problem, with development carried out by research teams at Sungkyunkwan University and Hanyang University."

  - id:      tips26-structured
    title:   "Investor-Tailored Structured Derivatives via Time-Series Generation"
    sponsor: "TIPS R&amp;D"
    period:  "2026.04 – Present"
    role:    "Technical Lead"
    desc:    "Builds a recommendation and selection procedure for investor-tailored ELS with decision-focused learning (SPO+ surrogate loss), a capital-adjusted objective, and simulation-based screening of maturity exposure."

