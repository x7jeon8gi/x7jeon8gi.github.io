#              (images in assets/img/research/, cropped from the papers)
# =============================================================================

intro: >
  My research studies representation learning for low signal-to-noise data,
  where the signal worth learning is small next to the noise and changes over
  time. Financial markets are the main testbed. The three lines below ask what
  to discretize, which structure to build into a model, and how to keep models
  interpretable and robust.

intro_ko: >
  신호에 비해 잡음이 크고 그 신호마저 시간에 따라 바뀌는 데이터에서의 표현학습을
  연구하며, 금융 시장을 주된 실증 무대로 삼고 있습니다. 아래 세 갈래는 무엇을
  이산화할지, 어떤 구조를 모형에 넣을지, 모형을 어떻게 해석 가능하고 강건하게
  만들지를 각각 다룹니다.

areas:
  - id:    discrete-representations
    title: "Discrete Representation Learning"
    title_ko: "이산 표현학습"
    desc: >
      Learning discrete latent factors with vector quantization from noisy
      cross-sectional stock data and fusing them with financial priors for
      stock ranking and portfolio construction. The next step discretizes
      market states by the portfolio decision they call for rather than by
      statistical similarity.
    desc_ko: "벡터 양자화로 잡음이 큰 횡단면 주식 데이터에서 이산 잠재 팩터를 학습하고, 금융 사전지식과 결합해 종목 순위 예측과 포트폴리오 구성에 쓰는 연구. 다음 단계로 시장 상태를 통계적 유사성이 아니라 요구하는 포트폴리오 결정에 따라 이산화하는 방법을 다룸."
    papers:   [ijcai26-vqfp, kbs25-factorvqvae, wp-dsq, cikmw25-fpqvae, kafo25-prismvq, kiie25-vq, kiie23-vqgan]
    projects: [nrf25-robust-vq, nrf23-vqvae-portfolio]
    figure:
      src:        "/assets/img/research/prism-vq.jpg"
      alt:        "Overview of the PRISM-VQ framework"
      caption:    "Overview of PRISM-VQ (IJCAI-ECAI 2026). Like a prism separating light, it decomposes cross-sectional market structure with discrete vector quantization, then uses the codes to gate experts over financial-prior and latent factors."
      caption_ko: "PRISM-VQ 개요 (IJCAI-ECAI 2026). 프리즘이 빛을 나누듯 벡터 양자화로 횡단면 시장 구조를 이산 코드로 분해하고, 그 코드로 금융 사전 팩터와 잠재 팩터 위의 전문가 모형을 선택함."

  - id:    structure-informed
    title: "Structure-Informed Learning"
    title_ko: "구조 기반 학습"
    desc: >
      Building known dynamics of financial time series into neural models as
      inductive bias, such as mean reversion, the heterogeneous autoregressive
      structure of volatility, and time-series decomposition, so that the
      models hold up under regimes not seen in training.
    desc_ko: "평균회귀, 변동성의 이질적 자기회귀(HAR) 구조, 시계열 분해처럼 금융 시계열에서 알려진 동역학을 신경망에 귀납적 편향으로 넣어, 학습 기간에 없던 국면에서도 성능이 유지되도록 하는 연구."
    papers:   [icaif25-deep-mr, icaif26-harcev, icaifw25-crypto, kiie24-pairs]
    projects: []
    figure:
      src:        "/assets/img/research/orca.jpg"
      alt:        "Architecture of ORCA"
      caption:    "ORCA, the model in Deep Mean-Reversion (ICAIF '25). Two augmented views share a Transformer encoder and are trained with instance- and cluster-level contrastive losses, plus a physics-informed loss that enforces Ornstein-Uhlenbeck dynamics."
      caption_ko: "Deep Mean-Reversion(ICAIF '25)의 ORCA 구조. 두 증강 뷰가 Transformer 인코더를 공유하고 인스턴스·군집 수준 대조학습으로 학습되며, Ornstein-Uhlenbeck 동역학을 강제하는 물리 정보 손실이 더해짐."

  - id:    interpretable-robust
    title: "Interpretable and Group-Robust Models"
    title_ko: "해석 가능하고 집단에 강건한 모형"
    desc: >
      Making factor models and decision policies explainable and robust across
      groups: aligning factor codebooks with language so that each factor can
      be read, defining groups by text for distributionally robust stock
      ranking, and coupling group robustness with interpretable hedging
      policies.
    desc_ko: "팩터 모형과 의사결정 정책을 설명 가능하고 집단 간에 강건하게 만드는 연구. 팩터 코드북을 언어와 정렬해 각 팩터를 읽을 수 있게 하고, 텍스트로 정의한 종목 집단에 대해 분포적으로 강건한 순위 학습을 하며, 해석 가능한 헤징 정책에 집단 강건성을 결합함."
    papers:   [wp-lexicon, wp-tagdro, wp-praxis]
    projects: []
    figure:
      src:        "/assets/img/research/lexicon.jpg"
      alt:        "Overview of the LEXICON framework"
      caption:    "Overview of LEXICON. Factor representations are aligned with human-language anchors through an optimal transport plan, so that each prediction can be read through the semantics of its factors."
      caption_ko: "LEXICON 개요. 최적수송 계획으로 팩터 표현을 자연어 앵커에 정렬해, 각 예측을 팩터의 의미로 읽을 수 있게 함."
