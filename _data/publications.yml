# =============================================================================
# Publications and presentations
#
# Lists are rendered newest first and numbered in reverse ([4], [3], ...).
# Add a new entry at the TOP of the matching list.
#
# Common fields
#   id           : unique slug, also the anchor (#id) other pages link to
#   title        : paper title
#   authors      : list; the entry containing "Namhyoung" is bolded,
#                  a trailing "*" marks the corresponding author
#   venue        : full venue name (italic on the site)
#   venue_short  : short label used on the home and research pages
#   year         : 4-digit year
#   note         : optional small note (acceptance rate, award, status)
#   keywords     : optional list, shown as #tags under the entry
#   selected     : true shows the paper under "Selected Publications" on home
#   url          : link the title points to
#   links        : optional extra links [{label: "PDF", url: "..."}]
#
# Presentations (international_talks, domestic_talks) also take
#   date         : "YYYY.MM"
#   location     : city, country
# =============================================================================

