---
layout: default
---

<div class="banner">
  <div class="wrap">
    {% if page.eyebrow %}<p class="banner-eyebrow">{{ page.eyebrow }}</p>{% endif %}
    <h1 class="banner-title">{{ page.title }}</h1>
    {% if page.lede %}<p class="banner-lede">{{ page.lede }}</p>{% endif %}
  </div>
</div>

<div class="wrap">
  <article class="page">
    {{ content }}
  </article>
</div>
