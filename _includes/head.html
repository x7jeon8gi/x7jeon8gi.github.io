{%- include lang-urls.html -%}
{%- assign T = site.data.i18n[L] -%}
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{% if page.title and page.url != "/" and page.url != "/ko/" %}{{ page.title }} · {{ T.name }}{% else %}{{ T.name }}{% if L == 'en' %} · {{ site.tagline }}{% endif %}{% endif %}</title>

  <link rel="alternate" hreflang="en" href="{{ url_en | absolute_url }}">
  <link rel="alternate" hreflang="ko" href="{{ url_ko | absolute_url }}">
  <link rel="alternate" hreflang="x-default" href="{{ url_en | absolute_url }}">

  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/img/favicon-32.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/img/favicon-16.png' | relative_url }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/img/apple-touch-icon.png' | relative_url }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400{% if L == 'ko' %}&family=Noto+Sans+KR:wght@400;500;700{% endif %}&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">

  {% seo title=false %}
</head>
