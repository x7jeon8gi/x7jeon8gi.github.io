<footer class="site-footer">
  <div class="wrap">
    <div class="footer-id">
      <strong>{{ site.author }}</strong>
      <span>Head of Research, Risk X tech Lab</span>
      <a href="mailto:{{ site.email }}">{{ site.email }}</a>
    </div>
    <div class="footer-links">
      {% for s in site.social %}{% unless s.icon == "email" %}
        <a href="{{ s.url | relative_url }}"{% unless s.icon == "pdf" %} target="_blank" rel="noopener"{% endunless %}>{{ s.name }}</a>
      {% endunless %}{% endfor %}
    </div>
    <p class="copy">© {{ "now" | date: "%Y" }} {{ site.author }}. Built with Jekyll and hosted on GitHub Pages.</p>
  </div>
</footer>
