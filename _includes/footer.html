{%- assign L = page.lang | default: "en" -%}
{%- assign T = site.data.i18n[L] -%}
<footer class="site-footer">
  <div class="wrap">
    <div class="footer-id">
      <strong>{{ T.name }}</strong>
      <span>{{ T.role }}</span>
      <a href="mailto:{{ site.email }}">{{ site.email }}</a>
    </div>
    <div class="footer-links">
      {% for s in site.social %}{% unless s.icon == "email" %}
        <a href="{{ s.url | relative_url }}"{% unless s.icon == "pdf" %} target="_blank" rel="noopener"{% endunless %}>{{ s.name }}</a>
      {% endunless %}{% endfor %}
    </div>
    <p class="copy">© {{ "now" | date: "%Y" }} {{ T.name }}. {{ T.copy }}</p>
  </div>
</footer>
